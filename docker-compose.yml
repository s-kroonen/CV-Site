# See docs/DEPLOYMENT.md for how to wire this into your existing Nginx Proxy
# Manager setup (shared Docker network vs. published port) and for the
# two-host redundancy/failover configuration.
#
# NPM's container has its own network namespace with its own loopback -
# "localhost"/127.0.0.1 typed into an NPM proxy host config can never reach
# this host's 127.0.0.1:3000 published port, no matter how correctly it's
# configured (confirmed this the hard way: NPM's forward target was exactly
# "http://127.0.0.1:3000" and still couldn't connect). npm_shared is a
# Docker network created once on the host (`docker network create
# npm_shared`, not owned by either stack's lifecycle) that both this stack
# and NPM's stack join, so NPM can reach this container directly by name
# (cv-site-web:3000) instead of through the host network at all.
#
# Deliberately uses compose variable substitution (${VAR}) instead of
# env_file: - .env for the secrets below. env_file requires a real file
# sitting next to this compose file on disk, which works for a local
# `docker compose up` (a .env file at the repo root) but is not something
# Portainer's git-based stack deploys can ever have (it deploys straight from
# the git checkout, no separate file upload step) - Portainer failed with
# "env file /data/compose/<id>/.env not found" until this was switched over.
# ${VAR} substitution works identically in both places: locally via the .env
# file next to this compose file (docker compose auto-loads it for
# substitution, no env_file directive needed), and on Portainer via that
# stack's "Environment variables" section in its UI/API.
services:
  web:
    image: ${GHCR_IMAGE:-ghcr.io/s-kroonen/cv-site}:latest
    container_name: cv-site-web
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      # Published port on the host. Default: loopback only (NPM on the same host reaches the container via
      # npm_shared instead). A reverse proxy on ANOTHER machine (e.g. Traefik) needs HOST_BIND set to this
      # host's LAN IP (or 0.0.0.0) and, if 3000 is taken, a different HOST_PORT.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "file:/data/db/prod.db"
      UPLOAD_DIR: "/data/uploads"
      SITE_URL: ${SITE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      # Despite the NEXT_PUBLIC_ name this is read at runtime (lib/turnstile-config.ts),
      # not baked into the image, so setting it here/in Portainer is enough.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      # Optional: Search Console / Bing Webmaster verification codes.
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      # Optional machine translation for the Dutch/English content (set one; see docs/TRANSLATION.md).
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      # Optional two-host redundancy (see docs/REDUNDANCY.md). Set SYNC_PEER_URL and the same SYNC_TOKEN on both hosts;
      # SITE_ROLE is "preferred" on the host that normally takes edits and "standby" on the other.
      SITE_ROLE: ${SITE_ROLE:-preferred}
      SYNC_PEER_URL: ${SYNC_PEER_URL:-}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-15}
      SYNC_ON_CONFLICT: ${SYNC_ON_CONFLICT:-}
      # Passkeys on several hostnames: a parent domain and the allowed origins (comma separated).
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
    volumes:
      - db_data:/data/db
      - upload_data:/data/uploads
    networks:
      - default
      - proxy

volumes:
  db_data:
  upload_data:

networks:
  # The shared network NPM runs on. Defaults to the existing external "npm_shared". On a host without NPM
  # (e.g. the Traefik-fronted main machine) set PROXY_NETWORK_EXTERNAL=false: compose then creates the network
  # itself instead of failing with "network npm_shared declared as external, but could not be found".
  proxy:
    name: ${PROXY_NETWORK:-npm_shared}
    external: ${PROXY_NETWORK_EXTERNAL:-true}
