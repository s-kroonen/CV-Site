name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        # GHCR requires a lowercase repository path; github.repository preserves
        # the repo's actual case (CV-Site), which docker/build-push-action then
        # rejects with "repository name must be lowercase". No lower() function
        # exists in GitHub Actions expression syntax, so it's done in the shell.
        run: echo "value=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.value }}:latest
            ${{ steps.image.outputs.value }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      # Both hosts get the same image. One failing must not cancel the other.
      fail-fast: false
      matrix:
        host: [ primary, secondary ]
    # The "secondary" host is the one that is often switched off: a redeploy that cannot reach it
    # is a warning, not a failed pipeline. It picks up the new image on its next redeploy.
    continue-on-error: ${{ matrix.host == 'secondary' }}
    steps:
      - name: Redeploy on ${{ matrix.host }}
        run: |
          BASE=${{ matrix.host == 'primary' && secrets.PRIMARY_PORTAINER_URL || secrets.SECONDARY_PORTAINER_URL }}
          TOKEN=${{ matrix.host == 'primary' && secrets.PRIMARY_PORTAINER_TOKEN || secrets.SECONDARY_PORTAINER_TOKEN }}
          SID=${{ matrix.host == 'primary' && secrets.PRIMARY_STACK_ID || secrets.SECONDARY_STACK_ID }}
          EID=${{ matrix.host == 'primary' && secrets.PRIMARY_ENDPOINT_ID || secrets.SECONDARY_ENDPOINT_ID }}
          # The git-redeploy call REPLACES the stack's environment variables with
          # whatever "Env" is in the body; omitting it wipes them to empty (this
          # is what blanked SESSION_SECRET etc.). So read the stack's current
          # env from Portainer and send it back unchanged. Values are never
          # printed, and an empty env aborts instead of deploying a broken stack.
          if [ -z "$BASE" ] || [ -z "$SID" ]; then
            echo "::warning::No Portainer secrets for ${{ matrix.host }}; skipping this host."
            exit 0
          fi
          ENV_JSON=$(curl -fsSL "$BASE/api/stacks/$SID" -H "X-API-Key: $TOKEN" | jq -c '.Env // []')
          if [ "$ENV_JSON" = "[]" ]; then
            echo "::error::Stack $SID has no environment variables set in Portainer; refusing to redeploy."
            exit 1
          fi
          BODY=$(jq -nc --argjson env "$ENV_JSON" '{Env: $env, PullImage: true, Prune: false}')
          curl -fsSL -X PUT \
            "$BASE/api/stacks/$SID/git/redeploy?endpointId=$EID" \
            -H "X-API-Key: $TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null
